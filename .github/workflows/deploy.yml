name: 部署项目

on:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write


jobs:

  build:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4


      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          node-version: 22


      - name: 安装依赖
        run: npm install


      - name: 构建
        run: npm run build


      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist



  deploy:

    needs: build

    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}


    steps:

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4